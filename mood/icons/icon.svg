<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 앱 아이콘 원본: 어두운 바탕, 왼쪽 위의 빛 하나, 양 끝이 사라지는 가는 물결. PNG(180·192·512)는 이 파일을 그대로 찍어 만든다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b1f"/><stop offset="1" stop-color="#000"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="0%" r="100%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ends" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <path d="M-10 290 C90 170 170 170 256 256 S 420 342 522 222" fill="none" stroke="url(#ends)" stroke-width="13" stroke-linecap="round"/>
</svg>
