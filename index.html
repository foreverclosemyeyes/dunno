<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>등불식당</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 게임. 캔버스 위에 한지 느낌의 따뜻한 종이 UI를 얹는다 */
:root{
  --night:#1f1a1c; --ink:#3d2c2e; --ink2:#6b5552; --paper:#f4ead6; --paper2:#eadbbe; --edge:#cdb48d;
  --persimmon:#cc8248; --lamp:#f2d58d; --leaf:#77a052; --berry:#c4614f; --water:#9cc0b4;
  --head:'Jua','Apple SD Gothic Neo',sans-serif; --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden;font-family:var(--body);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.paper{background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--paper2),0 3px 0 rgba(30,20,22,.35)}
button{font-family:var(--head);font-size:15px;color:var(--ink);background:var(--lamp);border:2px solid var(--ink);border-radius:8px;padding:5px 14px;cursor:pointer;box-shadow:inset 0 -3px 0 #d9ae5f}
button:hover{filter:brightness(1.05)}button:active{transform:translateY(1px);box-shadow:none}
button:disabled{background:#e2d6c0;color:#9a8b84;box-shadow:none;cursor:default;filter:none}
button.ghost{background:var(--paper)}
button:focus-visible{outline:3px solid var(--water);outline-offset:1px}
.stars{color:#d9ae5f;letter-spacing:1px;font-family:var(--head)}.stars i{font-style:normal;color:#d9cdb8}

/* HUD */
#hud{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));padding:6px 14px 8px;z-index:5;pointer-events:none;min-width:118px}
#hud .d{font-family:var(--head);font-size:13px;color:var(--ink2);display:flex;gap:6px}
#htime{font-family:var(--head);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
#hudr{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));z-index:5;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#hudr .g{font-family:var(--head);font-size:19px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
#hudr .g img{width:22px;height:22px}
#hlan{display:flex;gap:1px;cursor:pointer}#hlan img{width:14px;height:18px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 4px);z-index:5;pointer-events:none;
  font-family:var(--head);font-size:16px;padding:6px 16px 7px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#hint .k{display:inline-block;background:var(--ink);color:var(--paper);border-radius:5px;padding:0 6px;font-size:13px}
#hbtns{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)));z-index:5;display:flex;gap:6px}
#hbtns>div{width:50px;height:50px;padding:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
#hseed img{width:34px;height:34px}#hseed b{position:absolute;right:4px;bottom:1px;font-family:var(--head);font-size:13px}
#hseed .none{font-size:11px;text-align:center;line-height:1.1;color:var(--ink2)}
#hcan img{width:30px;height:30px}#hcan i{position:absolute;right:5px;top:8px;bottom:8px;width:5px;background:#d9cdb8;border-radius:3px;overflow:hidden;display:flex;align-items:flex-end}
#hcan u{display:block;width:100%;background:#6f9d8c}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;z-index:6;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:5px 14px 6px;font-size:15px;display:flex;gap:7px;align-items:center;animation:tin .25s ease-out}
.toast img{width:24px;height:auto;max-height:24px}.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* 대화 */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 4px);width:min(640px,calc(100vw - 24px));z-index:12;
  display:flex;gap:12px;padding:12px 16px 14px;box-sizing:border-box;cursor:pointer;min-height:104px}
#dlgpic{width:84px;height:84px;flex:none;background:#eadbbe;border-radius:8px;border:2px solid var(--edge)}
#dlg .tx{flex:1;min-width:0;display:flex;flex-direction:column}
#dlgname{font-family:var(--head);font-size:17px;color:var(--persimmon);margin-bottom:3px}
#dlgtext{font-size:17px;line-height:1.55;flex:1;word-break:keep-all}
#dlgmore{align-self:flex-end;font-size:12px;color:var(--ink2);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(2px)}}

/* 창 */
#veil{position:fixed;inset:0;background:rgba(31,26,28,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
#panel{width:min(560px,100%);max-height:min(86vh,680px);display:flex;flex-direction:column;padding:14px 16px 14px;box-sizing:border-box}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:8px;border-bottom:2px dashed var(--edge)}
.phead h2{margin:0;font-family:var(--head);font-weight:normal;font-size:23px;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--ink2);font-size:14px;line-height:1.5}.sub2{margin:0 0 8px;color:var(--ink2);font-size:14px}
.x{background:var(--paper);padding:2px 10px}
.pbody{overflow-y:auto;padding-top:10px;min-height:0;display:flex;flex-direction:column;gap:6px}
.pfoot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px}
.rows{display:flex;flex-direction:column;gap:6px}
.rows .row{padding:7px 9px;background:#efe2c8;border-radius:8px;border:2px solid var(--edge)}
.rows .row>img{width:34px;height:auto;flex:none}.rows .row>img.mid{width:44px}
.info{flex:1;min-width:0}.info b{font-family:var(--head);font-weight:normal;font-size:16px}
.ds{font-size:13px;color:var(--ink2);line-height:1.45}
.pr{font-family:var(--head);white-space:nowrap}
.btns{display:flex;gap:4px;flex:none}.btns button{padding:4px 10px;font-size:14px}
.row.off{opacity:.55}
.have{font-size:12px;background:var(--lamp);border-radius:4px;padding:0 5px}
.need{display:flex;flex-wrap:wrap;gap:2px 8px;margin:2px 0}
.nd{display:inline-flex;align-items:center;gap:2px;font-size:13px;white-space:nowrap}.nd img{width:18px;height:auto}.nd.no{color:var(--berry)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.tab{background:var(--paper);box-shadow:none;font-size:14px;padding:4px 10px}.tab.on{background:var(--lamp);box-shadow:inset 0 -3px 0 #d9ae5f}
h3{margin:6px 0 2px;font-family:var(--head);font-weight:normal;font-size:15px;color:var(--persimmon)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.item{display:flex;gap:7px;align-items:center;padding:5px 7px;background:#efe2c8;border-radius:8px;border:2px solid transparent}
.item[data-seed]{cursor:pointer}.item.sel{border-color:var(--persimmon)}
.item img{width:30px;height:auto;flex:none}.item b{font-family:var(--head);font-weight:normal}
.q{font-size:12px;color:#b8913f;white-space:nowrap}
.empty{color:var(--ink2);text-align:center;padding:16px}
.rlist,.glist{display:flex;flex-direction:column;gap:6px}
.rcard,.gcard{display:flex;gap:10px;align-items:center;padding:8px;background:#efe2c8;border-radius:8px}
.rcard img.big{width:96px;height:auto;flex:none}.rcard b,.gcard b{font-family:var(--head);font-weight:normal;font-size:16px}
.gcard img{width:48px;height:auto;flex:none}.gcard.lit{background:#f6e3b8}
.okk{font-size:13px;color:#7a8f3c}.wait{font-size:13px;color:var(--persimmon)}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:#efe2c8;border-radius:8px;text-align:center}
.fcard img{width:54px;height:auto}.fcard b{font-family:var(--head);font-weight:normal}.fcard.unk{opacity:.6}.qm{font-family:var(--head);font-size:30px;color:var(--edge);height:36px}
.sumb{text-align:center;line-height:1.6}.sumb .big{font-family:var(--head);font-size:34px;color:var(--persimmon)}.warn{color:var(--berry)}

/* 요리 */
#cook{position:fixed;inset:0;z-index:15;background:rgba(31,26,28,.62);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
#cookbox{width:min(720px,100%);padding:12px 14px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
#cookhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
#cookname{font-family:var(--head);font-size:22px}
#cookstep{font-family:var(--head);font-size:16px;color:var(--ink);background:var(--lamp);border-radius:10px;padding:2px 10px}
#cookopts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}#cookopts button{display:inline-flex;align-items:center;gap:5px}#cookopts img{width:22px;height:auto}#cookopts .kn{font-size:11px;background:var(--ink);color:var(--paper);border-radius:4px;padding:0 4px}
#cooktap{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid var(--ink)}
#cookcv{display:block;width:100%;height:auto}
#cookmsg{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:var(--head);font-size:24px;color:#fbf5ea;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);pointer-events:none}
#cookhelp{font-size:15px;text-align:center;min-height:22px}
#cookrev{position:absolute;left:0;right:0;bottom:8px;text-align:center;pointer-events:none;color:#fbf5ea;text-shadow:0 2px 0 var(--ink)}
#revname{font-family:var(--head);font-size:26px}#revstars{font-size:24px}#revcom{font-size:15px}#revtap{font-size:12px;opacity:.8;margin-top:2px}

/* 타이틀, 캐릭터 */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;text-align:center;
  background:radial-gradient(ellipse at center,rgba(31,26,28,.05),rgba(31,26,28,.6))}
#title h1{margin:0;font-family:var(--head);font-weight:normal;font-size:clamp(52px,13vw,96px);color:#fbecc8;letter-spacing:4px;line-height:1;
  text-shadow:0 0 24px rgba(255,190,110,.55),0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
#title .tag{color:#fbecc8;font-size:17px;text-shadow:0 2px 0 var(--ink);max-width:420px;line-height:1.5;word-break:keep-all}
#title .menu{display:flex;flex-direction:column;gap:8px;width:220px}#title .menu button{font-size:19px;padding:8px}
#title .hint{color:#eadbbe;font-size:13px;text-shadow:0 1px 0 var(--ink);line-height:1.6}
#creator{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:rgba(31,26,28,.55)}
#cbox{width:min(760px,100%);max-height:94vh;overflow-y:auto;padding:16px;box-sizing:border-box;display:grid;grid-template-columns:220px 1fr;gap:16px}
#cleft{display:flex;flex-direction:column;align-items:center;gap:8px}
#cprev{width:200px;height:240px;background:radial-gradient(ellipse at 50% 70%,#f6e3b8,#eadbbe 70%);border-radius:10px;border:2px solid var(--edge)}
#cbox h2{margin:0 0 4px;font-family:var(--head);font-weight:normal;font-size:23px}
.crow{margin-bottom:10px}.cl{display:block;font-family:var(--head);font-size:14px;color:var(--ink2);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--body);font-size:13px;padding:3px 9px;background:var(--paper);box-shadow:none;display:inline-flex;align-items:center;gap:4px;border-width:2px}
.chip i{width:11px;height:11px;border-radius:50%;border:1px solid var(--ink)}.chip.on{background:var(--lamp);border-color:var(--ink)}
#cname{font-family:var(--head);font-size:17px;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:#fffaf0;color:var(--ink);width:100%;box-sizing:border-box}
#cname:focus{outline:3px solid var(--water)}
@media (max-width:600px){#cbox{grid-template-columns:1fr}#cprev{width:150px;height:180px}#hud{min-width:0}#htime{font-size:18px}#hint{font-size:14px}}

/* 터치 */
#stick{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 50px);width:112px;height:112px;border-radius:50%;background:rgba(244,234,214,.18);border:2px solid rgba(61,44,46,.45);z-index:7}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(244,234,214,.85);border:2px solid var(--ink)}
#btnA{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 74px);width:78px;height:78px;border-radius:50%;font-size:26px;padding:0;z-index:7}
#btnBag{position:fixed;right:max(110px,calc(env(safe-area-inset-right,0px) + 100px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 70px);width:54px;height:54px;border-radius:50%;font-size:13px;padding:0;background:var(--paper);z-index:7}
body.touch #toasts{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 196px)}
@media (prefers-reduced-motion:reduce){.toast,#dlgmore{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="paper" hidden><div class="d"><span id="hday">1일째</span><span>·</span><span id="hwx">맑음</span></div><div id="htime">오전 6:00</div></div>
<div id="hudr" class="paper" hidden><div class="g"><img id="hcoin" class="px" alt=""><span id="hgold">0</span><span style="font-size:13px">냥</span></div><div id="hlan" title="손님 수첩"></div></div>
<div id="hint" class="paper" hidden><span class="k">A</span><span id="hintl"></span></div>
<div id="hbtns" hidden><div id="hseed" class="paper" title="씨앗 바꾸기 (Q)"></div><div id="hcan" class="paper" title="물뿌리개"></div></div>
<div id="toasts"></div>

<div id="dlg" class="paper" hidden><canvas id="dlgpic" width="84" height="84" class="px"></canvas><div class="tx"><div id="dlgname"></div><div id="dlgtext"></div><div id="dlgmore">▼ 다음</div></div></div>
<div id="veil" hidden><div id="panel" class="paper" role="dialog" aria-modal="true"></div></div>

<div id="cook" hidden><div id="cookbox" class="paper">
  <div id="cookhead"><span id="cookname"></span><span id="cookstep"></span></div>
  <div id="cooktap"><canvas id="cookcv" width="200" height="130" class="px"></canvas><div id="cookmsg"></div>
    <div id="cookrev" hidden><div id="revname"></div><div id="revstars"></div><div id="revcom"></div><div id="revtap">눌러서 계속</div></div></div>
  <div id="cookopts" hidden></div>
  <div id="cookhelp"></div>
</div></div>

<div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="btnBag" type="button">바구니</button><button id="btnA" type="button">A</button></div>

<div id="title">
  <h1>등불식당</h1>
  <div class="tag">낮에는 밭을 일구고 물고기를 낚고, 밤에는 길 잃은 혼령에게 기억 속 그 맛을 차려 주는 곳.</div>
  <div class="menu"><button id="bCont" type="button" hidden>이어하기</button><button id="bNew" type="button">새로 시작</button></div>
  <div class="hint">이동 WASD·방향키 · 행동 스페이스(꾹 누르기도 써요) · 바구니 Tab · 씨앗 바꾸기 Q<br>휴대폰은 조이스틱과 A 버튼</div>
</div>

<div id="creator" hidden><div id="cbox" class="paper">
  <div id="cleft"><canvas id="cprev" width="200" height="240" class="px"></canvas>
    <div class="row"><button id="crot" type="button" class="ghost">돌려 보기</button><button id="crand" type="button" class="ghost">아무거나</button></div></div>
  <div><h2>새 사장님</h2><p class="sub" style="margin-bottom:10px">할머니의 식당을 물려받을 사람을 꾸며 주세요.</p>
    <div class="crow"><label class="cl" for="cname">이름</label><input id="cname" maxlength="8" placeholder="사장님" autocomplete="off"></div>
    <div id="copts"></div>
    <button id="cgo" type="button" style="width:100%;font-size:18px;padding:8px">식당으로 가기</button></div>
</div></div>

<script src="js/art.js"></script>
<script src="js/dishes.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/cook.js"></script>
<script src="js/game.js"></script>
<script>$('hcoin').src=curl(IC.coin);if(isTouch)document.body.classList.add('touch');</script>
</body>
</html>
