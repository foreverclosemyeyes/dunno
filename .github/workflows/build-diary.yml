# 업무다이어리 설치 파일 자동 만들기
# - diary-app 폴더가 바뀌어 올라오면: Mac(.dmg)·Windows(.exe) 설치 파일을 만들어 "Artifacts"에 올림
# - 매번 "Releases"에도 올림 (버전 1.0.빌드번호) → 앱 안 UPDATE 버튼이 여기서 새 버전을 받아 감
name: 업무다이어리 설치 파일 만들기

on:
  push:
    paths:
      - 'diary-app/**'
      - '.github/workflows/build-diary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: diary-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diary-app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 설치 파일 만들기
        run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Mac에서 실제로 켜 보기 (서명 확인 + 30초 실행)
        if: runner.os == 'macOS'
        run: |
          set +e
          for APP in dist/mac*/*.app; do
            echo "== $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"; echo "codesign exit=$?"
            codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format" 
          done
          APP=$(ls -d dist/mac-arm64/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          rm -rf ~/Library/Logs/DiagnosticReports/* 2>/dev/null
          "$APP/Contents/MacOS/$EXE" > smoke.log 2>&1 &
          PID=$!
          sleep 30
          if kill -0 $PID 2>/dev/null; then
            echo "✅ 30초 동안 정상 실행됨"; kill $PID; sleep 2; STATUS=0
          else
            wait $PID; echo "❌ 앱이 꺼짐 (exit=$?)"; STATUS=1
          fi
          echo "--- 앱 출력 ---"; tail -60 smoke.log
          echo "--- 앱 기록 ---"; cat ~/Library/Logs/*/main.log 2>/dev/null | tail -40
          echo "--- 충돌 보고서 ---"
          for f in ~/Library/Logs/DiagnosticReports/*; do [ -f "$f" ] && { echo "## $f"; head -120 "$f"; }; done
          exit $STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: WorkDiary-${{ runner.os }}
          path: |
            diary-app/dist/*.dmg
            diary-app/dist/*.zip
            diary-app/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          target_commitish: ${{ github.sha }}
          tag_name: diary-v1.0.${{ github.run_number }}
          name: 업무다이어리 v1.0.${{ github.run_number }}
          body: |
            앱 안의 UPDATE 버튼으로 자동으로 받아져요. 처음 설치할 때만 아래 파일을 받으세요.
            Mac: Apple 칩(M1~M4) → `WorkDiary-...-mac-arm64.dmg`, 인텔 Mac → `WorkDiary-...-mac-x64.dmg`
            Windows: `WorkDiary-...-win-x64.exe`
          files: out/*
